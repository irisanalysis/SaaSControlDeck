[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-platform-pro1"
version = "1.0.0"
description = "AI Data Analysis Platform - Project 1"
authors = [{name = "Development Team", email = "dev@yourplatform.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]

dependencies = [
    # Web框架
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "gunicorn==21.2.0",
    # 异步和并发
    "aiofiles==23.2.1",
    "httpx==0.25.2",
    # 数据库
    "sqlalchemy[asyncio]==2.0.23",
    "asyncpg==0.29.0",
    "alembic==1.12.1",
    # 缓存和队列
    "redis[hiredis]==4.6.0",
    "celery[redis]==5.3.4",
    # AI和机器学习
    "openai==1.3.6",
    "numpy>=1.26.0,<2.0.0",
    "pandas==2.1.4",
    "scikit-learn==1.3.2",
    # 文件处理
    "openpyxl==3.1.2",
    "xlrd==2.0.1",
    "pyarrow==14.0.1",
    "chardet==5.2.0",
    # 验证和序列化
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "email-validator==2.1.0",
    # 认证和安全
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    # 监控和日志
    "structlog==23.2.0",
    "prometheus-client==0.19.0",
    "sentry-sdk[fastapi]==1.38.0",
    # 工具类
    "python-dotenv==1.0.0",
    "typer==0.9.0",
    "rich==13.7.0",
    "aioredis>=2.0.1",
    "bcrypt>=4.3.0",
]

[project.optional-dependencies]
dev = [
    # 测试
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",

    # 开发工具
    "black==23.11.0",
    "isort==5.12.0",
    "flake8==6.1.0",
    "mypy==1.7.1",
]

distributed = [
    # 分布式计算 - 可选安装
    # "ray[default]==2.8.0",  # 注释：与pydantic 2.x冲突，需要升级到兼容版本
]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = [".", "shared"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
