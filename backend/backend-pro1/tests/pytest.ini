"""
Pytest configuration file for backend testing
Configures test environment, dependencies, and test discovery
RELEVANT FILES: conftest.py, requirements.txt, main.py, test_*.py
"""

import os
import sys
from pathlib import Path

# Add project root to path for imports
project_root = Path(__file__).parent.parent
sys.path.insert(0, str(project_root))

# Test configuration
pytest_plugins = []

# Pytest collection configuration
collect_ignore_glob = [
    "*/migrations/*",
    "*/alembic/*",
    "*/.venv/*",
    "*/venv/*",
    "*/node_modules/*"
]

# Test markers
markers = [
    "unit: Unit tests - fast, isolated tests",
    "integration: Integration tests - test component interactions",
    "api: API endpoint tests - test HTTP interfaces",
    "database: Database-related tests - require database connection",
    "slow: Slow tests - tests that take longer to run",
    "redis: Redis-related tests - require Redis connection",
    "auth: Authentication/authorization tests",
    "upload: File upload tests - test file handling",
    "preview: Data preview tests - test data analysis",
    "quality: Data quality tests - test quality analysis",
    "performance: Performance tests - test response times and throughput"
]

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Minimum version requirements
minversion = "6.0"

# Test output configuration
addopts = [
    "-v",  # Verbose output
    "--tb=short",  # Shorter traceback format
    "--strict-markers",  # Strict marker checking
    "--disable-warnings",  # Disable pytest warnings
    "--color=yes",  # Colored output
    "--durations=10",  # Show 10 slowest tests
    # Coverage options (uncomment when ready)
    # "--cov=.",
    # "--cov-report=term-missing",
    # "--cov-report=html:htmlcov",
    # "--cov-fail-under=80"
]

# Asyncio configuration
asyncio_mode = "auto"

# Test environment variables
env = {
    "TESTING": "1",
    "DATABASE_URL": "sqlite:///:memory:",
    "REDIS_URL": "redis://localhost:6379/15",  # Test database
    "SECRET_KEY": "test-secret-key-for-testing-only",
    "LOG_LEVEL": "ERROR",  # Reduce logging during tests
}

# Set environment variables for tests
for key, value in env.items():
    os.environ.setdefault(key, value)

# Test fixtures scope
testpaths = ["tests"]

# Timeout configuration (in seconds)
timeout = 300  # 5 minutes for entire test suite
timeout_method = "thread"

# Parallel execution configuration
# Run with: pytest -n auto (requires pytest-xdist)
# addopts.append("-n auto") if you want parallel by default

# Filtering configuration
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore:.*unclosed.*:ResourceWarning",
]

# Custom test categories
def pytest_configure(config):
    """Configure pytest with custom settings"""
    # Register custom markers
    for marker in markers:
        config.addinivalue_line("markers", marker)

def pytest_collection_modifyitems(config, items):
    """Modify test collection to add markers automatically"""
    for item in items:
        # Add markers based on test file location
        if "unit" in str(item.fspath):
            item.add_marker("unit")
        elif "integration" in str(item.fspath):
            item.add_marker("integration")

        # Add markers based on test name patterns
        if "api" in item.name or "endpoint" in item.name:
            item.add_marker("api")
        if "database" in item.name or "db" in item.name:
            item.add_marker("database")
        if "auth" in item.name or "permission" in item.name:
            item.add_marker("auth")
        if "upload" in item.name:
            item.add_marker("upload")
        if "preview" in item.name:
            item.add_marker("preview")
        if "quality" in item.name:
            item.add_marker("quality")
        if "performance" in item.name or "large" in item.name:
            item.add_marker("performance")

        # Mark slow tests
        if any(keyword in item.name.lower() for keyword in ['large', 'performance', 'stress']):
            item.add_marker("slow")

def pytest_runtest_setup(item):
    """Setup for individual test runs"""
    # Skip slow tests unless explicitly requested
    if "slow" in [marker.name for marker in item.iter_markers()]:
        if not item.config.getoption("--runslow", default=False):
            import pytest
            pytest.skip("need --runslow option to run slow tests")

def pytest_addoption(parser):
    """Add custom command line options"""
    parser.addoption(
        "--runslow",
        action="store_true",
        default=False,
        help="run slow tests"
    )
    parser.addoption(
        "--runperformance",
        action="store_true",
        default=False,
        help="run performance tests"
    )
    parser.addoption(
        "--integration-only",
        action="store_true",
        default=False,
        help="run only integration tests"
    )
    parser.addoption(
        "--unit-only",
        action="store_true",
        default=False,
        help="run only unit tests"
    )

# Test data configuration
TEST_DATA_DIR = Path(__file__).parent / "test_data"
TEST_UPLOADS_DIR = Path(__file__).parent / "test_uploads"

# Ensure test directories exist
TEST_DATA_DIR.mkdir(exist_ok=True)
TEST_UPLOADS_DIR.mkdir(exist_ok=True)

# Cleanup configuration
def pytest_sessionfinish(session, exitstatus):
    """Cleanup after test session"""
    import shutil

    # Clean up test upload directories
    if TEST_UPLOADS_DIR.exists():
        shutil.rmtree(TEST_UPLOADS_DIR, ignore_errors=True)

    # Clean up any temporary test files
    temp_files = Path("/tmp").glob("test_*")
    for temp_file in temp_files:
        try:
            if temp_file.is_file():
                temp_file.unlink()
            elif temp_file.is_dir():
                shutil.rmtree(temp_file)
        except:
            pass